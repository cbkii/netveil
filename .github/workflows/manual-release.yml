name: Manual Release

run-name: Manual Release · ${{ inputs.version_tag || 'auto' }}

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release version/tag. Blank auto-increments patch; explicit X.Y.Z or vX.Y.Z is authoritative.'
        required: false
        type: string
      draft:
        description: 'Leave the GitHub Release as a draft'
        required: true
        default: false
        type: boolean
      prerelease:
        description: 'Mark the GitHub Release as a pre-release'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: netveil-manual-release
  cancel-in-progress: false

jobs:
  release:
    name: Build, verify and publish signed APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Require default branch
        shell: bash
        run: |
          set +e
          set +u
          set +o pipefail
          default_branch='${{ github.event.repository.default_branch }}'
          if [[ "$GITHUB_REF_TYPE" != 'branch' || "$GITHUB_REF_NAME" != "$default_branch" ]]; then
            printf 'STOP: releases must be dispatched from the default branch (%s), got %s/%s.\n' \
              "$default_branch" "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true

      - name: Verify exact default-branch HEAD
        shell: bash
        run: |
          set +e
          set +u
          set +o pipefail
          if ! git fetch --tags origin "+refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"; then
            printf 'STOP: failed to refresh default branch and tags before release.\n' >&2
            exit 1
          fi
          local_head=$(git rev-parse HEAD) || exit 1
          remote_head=$(git rev-parse "origin/${GITHUB_REF_NAME}") || exit 1
          if [[ "$local_head" != "$remote_head" ]]; then
            printf 'STOP: release checkout is stale. Local=%s Remote=%s\n' "$local_head" "$remote_head" >&2
            exit 1
          fi

      - name: Require signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set +e
          set +u
          set +o pipefail
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              printf 'ERROR: required release secret %s is not configured.\n' "$name" >&2
              missing=$((missing + 1))
            fi
          done
          if ((missing > 0)); then
            exit 1
          fi
          printf 'Signing secret names verified.\n'

      - name: Repository release sanity
        shell: bash
        run: |
          set +e
          set +u
          set +o pipefail
          failed=0
          for path in \
            app/src/main/resources/META-INF/xposed/java_init.list \
            app/src/main/resources/META-INF/xposed/module.prop \
            app/build.gradle.kts \
            app/lint.xml; do
            if [[ ! -f "$path" ]]; then
              printf 'ERROR: required release input is missing: %s\n' "$path" >&2
              failed=$((failed + 1))
            fi
          done
          if grep -R 'de.robv.android.xposed' -n app/src/main; then
            printf 'ERROR: legacy Xposed API reference found.\n' >&2
            failed=$((failed + 1))
          fi
          if grep -R 'android.permission.INTERNET' -n app/src/main; then
            printf 'ERROR: unexpected INTERNET permission found.\n' >&2
            failed=$((failed + 1))
          fi
          if ! grep -F 'applicationId = "dev.ip.netveil"' app/build.gradle.kts >/dev/null; then
            printf 'ERROR: applicationId is not dev.ip.netveil.\n' >&2
            failed=$((failed + 1))
          fi
          if ((failed > 0)); then
            exit 1
          fi

      - name: Resolve authoritative release version
        id: version
        env:
          INPUT_VERSION_TAG: ${{ inputs.version_tag }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          set +u
          set +o pipefail

          source_version=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          source_code=$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)
          if [[ -z "$source_version" || ! "$source_code" =~ ^[0-9]+$ ]]; then
            printf 'STOP: unable to resolve versionName/versionCode from app/build.gradle.kts.\n' >&2
            exit 1
          fi

          requested=$(printf '%s' "${INPUT_VERSION_TAG:-}" | xargs)
          requested=${requested#v}
          if [[ -z "$requested" ]]; then
            if [[ ! "$source_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              printf 'STOP: automatic patch increment requires numeric X.Y.Z source version; found %s.\n' "$source_version" >&2
              exit 1
            fi
            target_version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
            version_source='auto-patch'
          else
            target_version=$requested
            if [[ ! "$target_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
              printf 'STOP: requested version %s is not a supported semantic version.\n' "$target_version" >&2
              exit 1
            fi
            version_source='workflow-dispatch'
          fi

          release_tag="v${target_version}"
          target_code=$source_code
          metadata_changed=false
          if [[ "$target_version" != "$source_version" ]]; then
            target_code=$((source_code + 1))
            metadata_changed=true
          fi

          existing_release=false
          existing_draft=false
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            existing_release=true
            existing_draft=$(gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')
            if [[ "$existing_draft" != 'true' ]]; then
              printf 'STOP: published GitHub Release %s already exists; published releases are immutable.\n' "$release_tag" >&2
              exit 1
            fi
            if [[ "$metadata_changed" == 'true' ]]; then
              printf 'STOP: draft release %s exists but source metadata is still %s; refusing an ambiguous resume.\n' \
                "$release_tag" "$source_version" >&2
              exit 1
            fi
          fi

          remote_tag_sha=$(git ls-remote --refs origin "refs/tags/${release_tag}" | awk 'NR==1 {print $1}')
          if [[ -n "$remote_tag_sha" && "$metadata_changed" == 'true' ]]; then
            printf 'STOP: tag %s already exists before the required metadata commit.\n' "$release_tag" >&2
            exit 1
          fi
          if [[ -n "$remote_tag_sha" && "$metadata_changed" == 'false' ]]; then
            current_sha=$(git rev-parse HEAD) || exit 1
            if [[ "$remote_tag_sha" != "$current_sha" ]]; then
              printf 'STOP: existing tag %s points to %s, expected current source %s.\n' \
                "$release_tag" "$remote_tag_sha" "$current_sha" >&2
              exit 1
            fi
          fi
          if [[ -n "$remote_tag_sha" && "$existing_release" != 'true' ]]; then
            printf 'STOP: tag %s exists without a GitHub Release; refusing to guess recovery intent.\n' "$release_tag" >&2
            exit 1
          fi

          if [[ "$metadata_changed" == 'true' ]]; then
            if ! TARGET_VERSION="$target_version" TARGET_CODE="$target_code" python3 - <<'PY'
          import os
          import pathlib
          import re
          import sys

          path = pathlib.Path('app/build.gradle.kts')
          text = path.read_text(encoding='utf-8')
          version = os.environ['TARGET_VERSION']
          code = os.environ['TARGET_CODE']
          text, code_count = re.subn(
              r'(?m)^(\s*versionCode\s*=\s*)\d+(\s*)$',
              rf'\g<1>{code}\g<2>',
              text,
              count=1,
          )
          text, name_count = re.subn(
              r'(?m)^(\s*versionName\s*=\s*)"[^"]*"(\s*)$',
              rf'\g<1>"{version}"\g<2>',
              text,
              count=1,
          )
          if code_count != 1 or name_count != 1:
              print(
                  f'STOP: expected exactly one versionCode/versionName assignment; '
                  f'found versionCode={code_count}, versionName={name_count}.',
                  file=sys.stderr,
              )
              sys.exit(1)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
            then
              printf 'STOP: failed to apply authoritative release version metadata.\n' >&2
              exit 1
            fi
          fi

          {
            printf 'release_tag=%s\n' "$release_tag"
            printf 'version_name=%s\n' "$target_version"
            printf 'version_code=%s\n' "$target_code"
            printf 'version_source=%s\n' "$version_source"
            printf 'metadata_changed=%s\n' "$metadata_changed"
            printf 'source_sha=%s\n' "$(git rev-parse HEAD)"
            printf 'resume_draft=%s\n' "$existing_draft"
          } >> "$GITHUB_OUTPUT"

          printf 'Release plan: %s, versionCode=%s, source=%s, resumeDraft=%s.\n' \
            "$release_tag" "$target_code" "$version_source" "$existing_draft"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Install exact Android SDK inputs
        shell: bash
        run: |
          set +e
          set +u
          set +o pipefail
          sdk_root=${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            sdkmanager=$(command -v sdkmanager 2>/dev/null || true)
          fi
          if [[ -z "$sdkmanager" || ! -x "$sdkmanager" ]]; then
            printf 'STOP: sdkmanager is unavailable.\n' >&2
            exit 1
          fi
          if ! "$sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' >/dev/null; then
            printf 'STOP: failed to provision Android SDK 36/build-tools 36.0.0.\n' >&2
            exit 1
          fi

      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set +e
          set +u
          set +o pipefail
          umask 077
          keystore="$GITHUB_WORKSPACE/ReleaseKey.jks"
          if ! printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"; then
            printf 'STOP: KEYSTORE_BASE64 is not valid base64 keystore content.\n' >&2
            rm -f "$keystore"
            exit 1
          fi
          if [[ ! -s "$keystore" ]]; then
            printf 'STOP: decoded release keystore is empty.\n' >&2
            rm -f "$keystore"
            exit 1
          fi
          if ! keytool -list -keystore "$keystore" -storepass "$KEYSTORE_PASSWORD" \
              -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            printf 'STOP: keystore password/alias validation failed.\n' >&2
            rm -f "$keystore"
            exit 1
          fi
          {
            printf 'storeFile=%s\n' "$keystore"
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties

      - name: Build and qualify exact signed APK
        id: build
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version_name }}
          RELEASE_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        shell: bash
        run: |
          set +e
          set +u
          set +o pipefail

          if ! gradle --no-daemon --stacktrace --warning-mode=all \
              :app:testDebugUnitTest :app:lintRelease :app:assembleRelease; then
            printf 'STOP: release tests/lint/build failed. Source metadata has not been pushed.\n' >&2
            exit 1
          fi

          apk='app/build/outputs/apk/release/app-release.apk'
          if [[ ! -s "$apk" ]]; then
            printf 'STOP: signed release APK was not produced at %s.\n' "$apk" >&2
            exit 1
          fi

          sdk_root=${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}
          apksigner="$sdk_root/build-tools/36.0.0/apksigner"
          aapt="$sdk_root/build-tools/36.0.0/aapt"
          if [[ ! -x "$apksigner" || ! -x "$aapt" ]]; then
            printf 'STOP: expected Android build-tools 36.0.0 verifier binaries are missing.\n' >&2
            exit 1
          fi
          if ! "$apksigner" verify --verbose --print-certs "$apk"; then
            printf 'STOP: APK signature verification failed.\n' >&2
            exit 1
          fi

          badging=$($aapt dump badging "$apk")
          rc=$?
          if ((rc != 0)); then
            printf 'STOP: aapt could not inspect the release APK.\n' >&2
            exit "$rc"
          fi
          package_name=$(printf '%s\n' "$badging" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)
          version_code=$(printf '%s\n' "$badging" | sed -n "s/^package: .* versionCode='\([^']*\)'.*/\1/p" | head -n 1)
          version_name=$(printf '%s\n' "$badging" | sed -n "s/^package: .* versionName='\([^']*\)'.*/\1/p" | head -n 1)

          if [[ "$package_name" != 'dev.ip.netveil' ]]; then
            printf 'STOP: APK package is %s; expected dev.ip.netveil.\n' "$package_name" >&2
            exit 1
          fi
          if [[ "$version_name" != "$RELEASE_VERSION" ]]; then
            printf 'STOP: APK versionName is %s; expected %s.\n' "$version_name" "$RELEASE_VERSION" >&2
            exit 1
          fi
          if [[ "$version_code" != "$RELEASE_VERSION_CODE" ]]; then
            printf 'STOP: APK versionCode is %s; expected %s.\n' "$version_code" "$RELEASE_VERSION_CODE" >&2
            exit 1
          fi

          for entry in META-INF/xposed/java_init.list META-INF/xposed/module.prop; do
            if ! unzip -Z1 "$apk" | grep -Fx "$entry" >/dev/null; then
              printf 'STOP: APK is missing %s.\n' "$entry" >&2
              exit 1
            fi
          done
          if "$aapt" dump permissions "$apk" | grep -F 'android.permission.INTERNET' >/dev/null; then
            printf 'STOP: release APK unexpectedly requests INTERNET permission.\n' >&2
            exit 1
          fi

          mkdir -p dist
          output="dist/dev.ip.netveil-${RELEASE_TAG}.apk"
          if ! cp "$apk" "$output"; then
            printf 'STOP: failed to stage release APK.\n' >&2
            exit 1
          fi
          if ! (cd dist && sha256sum "$(basename "$output")" > SHA256SUMS.txt); then
            printf 'STOP: failed to create SHA256SUMS.txt.\n' >&2
            exit 1
          fi
          if ! (cd dist && sha256sum -c SHA256SUMS.txt); then
            printf 'STOP: local release checksum verification failed.\n' >&2
            exit 1
          fi
          {
            printf 'apk=%s\n' "$output"
            printf 'apk_name=%s\n' "$(basename "$output")"
            printf 'package_name=%s\n' "$package_name"
          } >> "$GITHUB_OUTPUT"

      - name: Preserve qualified release bundle
        uses: actions/upload-artifact@v4
        with:
          name: qualified-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.build.outputs.apk }}
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Commit and push authoritative release metadata
        id: source
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          METADATA_CHANGED: ${{ steps.version.outputs.metadata_changed }}
          SOURCE_SHA: ${{ steps.version.outputs.source_sha }}
        shell: bash
        run: |
          set +e
          set +u
          set +o pipefail

          release_sha=$(git rev-parse HEAD) || exit 1
          if [[ "$METADATA_CHANGED" == 'true' ]]; then
            if git diff --quiet -- app/build.gradle.kts; then
              printf 'STOP: release metadata was expected to change but app/build.gradle.kts is unchanged.\n' >&2
              exit 1
            fi
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- app/build.gradle.kts
            if ! git commit -m "chore(release): prepare ${RELEASE_TAG}"; then
              printf 'STOP: failed to commit release metadata.\n' >&2
              exit 1
            fi
            release_sha=$(git rev-parse HEAD) || exit 1
            if ! git push --force-with-lease="refs/heads/${GITHUB_REF_NAME}:${SOURCE_SHA}" \
                origin "HEAD:${GITHUB_REF_NAME}"; then
              printf 'STOP: default branch changed or release metadata push failed; release not published.\n' >&2
              exit 1
            fi
          fi
          printf 'release_sha=%s\n' "$release_sha" >> "$GITHUB_OUTPUT"

      - name: Create or resume draft release
        id: draft_release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          RELEASE_SHA: ${{ steps.source.outputs.release_sha }}
          PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          set +e
          set +u
          set +o pipefail

          if ! git fetch --tags origin >/dev/null 2>&1; then
            printf 'STOP: unable to refresh tags before publication.\n' >&2
            exit 1
          fi

          existing_release=false
          existing_draft=false
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            existing_release=true
            existing_draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')
            if [[ "$existing_draft" != 'true' ]]; then
              printf 'STOP: published release %s appeared while building.\n' "$RELEASE_TAG" >&2
              exit 1
            fi
          fi

          tag_sha=$(git ls-remote --refs origin "refs/tags/${RELEASE_TAG}" | awk 'NR==1 {print $1}')
          if [[ "$existing_release" == 'true' ]]; then
            if [[ -z "$tag_sha" || "$tag_sha" != "$RELEASE_SHA" ]]; then
              printf 'STOP: resumable draft tag %s points to %s; expected %s.\n' \
                "$RELEASE_TAG" "${tag_sha:-missing}" "$RELEASE_SHA" >&2
              exit 1
            fi
            printf 'Resuming existing draft release %s.\n' "$RELEASE_TAG"
          else
            if [[ -n "$tag_sha" ]]; then
              printf 'STOP: tag %s appeared without a draft release while building.\n' "$RELEASE_TAG" >&2
              exit 1
            fi
            args=(
              release create "$RELEASE_TAG"
              --repo "$GITHUB_REPOSITORY"
              --target "$RELEASE_SHA"
              --title "NetVeil ${RELEASE_TAG}"
              --generate-notes
              --draft
            )
            if [[ "$PRERELEASE" == 'true' ]]; then
              args+=(--prerelease)
            fi
            if ! gh "${args[@]}"; then
              printf 'STOP: failed to create draft release %s.\n' "$RELEASE_TAG" >&2
              exit 1
            fi
            tag_sha=$(git ls-remote --refs origin "refs/tags/${RELEASE_TAG}" | awk 'NR==1 {print $1}')
            if [[ "$tag_sha" != "$RELEASE_SHA" ]]; then
              printf 'STOP: newly created tag %s points to %s; expected %s.\n' \
                "$RELEASE_TAG" "${tag_sha:-missing}" "$RELEASE_SHA" >&2
              exit 1
            fi
          fi
          printf 'tag_sha=%s\n' "$tag_sha" >> "$GITHUB_OUTPUT"

      - name: Upload and verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          RELEASE_APK: ${{ steps.build.outputs.apk }}
          RELEASE_APK_NAME: ${{ steps.build.outputs.apk_name }}
        shell: bash
        run: |
          set +e
          set +u
          set +o pipefail

          if ! gh release upload "$RELEASE_TAG" "$RELEASE_APK" dist/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" --clobber; then
            printf 'STOP: release asset upload failed; the draft is retained for a safe retry.\n' >&2
            exit 1
          fi

          assets=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name')
          rc=$?
          if ((rc != 0)); then
            printf 'STOP: unable to inspect uploaded release assets.\n' >&2
            exit "$rc"
          fi
          if ! grep -Fx "$RELEASE_APK_NAME" <<<"$assets" >/dev/null; then
            printf 'STOP: uploaded APK asset %s is missing from the draft release.\n' "$RELEASE_APK_NAME" >&2
            exit 1
          fi
          if ! grep -Fx 'SHA256SUMS.txt' <<<"$assets" >/dev/null; then
            printf 'STOP: uploaded SHA256SUMS.txt is missing from the draft release.\n' >&2
            exit 1
          fi

          rm -rf remote-check
          mkdir -p remote-check
          if ! gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern "$RELEASE_APK_NAME" --pattern 'SHA256SUMS.txt' \
              --dir remote-check --clobber; then
            printf 'STOP: unable to download draft assets for byte verification.\n' >&2
            exit 1
          fi
          if ! (cd remote-check && sha256sum -c SHA256SUMS.txt); then
            printf 'STOP: downloaded release asset checksum does not match the qualified APK.\n' >&2
            exit 1
          fi

      - name: Finalise requested release state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          set +e
          set +u
          set +o pipefail

          edit_args=(
            release edit "$RELEASE_TAG"
            --repo "$GITHUB_REPOSITORY"
            --title "NetVeil ${RELEASE_TAG}"
          )
          if [[ "$PRERELEASE" == 'true' ]]; then
            edit_args+=(--prerelease)
          else
            edit_args+=(--prerelease=false)
          fi
          if [[ "$DRAFT" == 'true' ]]; then
            edit_args+=(--draft)
          else
            edit_args+=(--draft=false)
          fi
          if ! gh "${edit_args[@]}"; then
            printf 'STOP: failed to apply requested release state; the draft remains recoverable.\n' >&2
            exit 1
          fi

          actual_draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')
          actual_prerelease=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease')
          if [[ "$actual_draft" != "$DRAFT" ]]; then
            printf 'STOP: release draft state is %s; expected %s.\n' "$actual_draft" "$DRAFT" >&2
            exit 1
          fi
          if [[ "$actual_prerelease" != "$PRERELEASE" ]]; then
            printf 'STOP: release prerelease state is %s; expected %s.\n' "$actual_prerelease" "$PRERELEASE" >&2
            exit 1
          fi

      - name: Final release verification
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          RELEASE_SHA: ${{ steps.source.outputs.release_sha }}
          RELEASE_APK_NAME: ${{ steps.build.outputs.apk_name }}
        shell: bash
        run: |
          set +e
          set +u
          set +o pipefail

          tag_sha=$(git ls-remote --refs origin "refs/tags/${RELEASE_TAG}" | awk 'NR==1 {print $1}')
          if [[ "$tag_sha" != "$RELEASE_SHA" ]]; then
            printf 'STOP: final tag %s points to %s; expected %s.\n' \
              "$RELEASE_TAG" "${tag_sha:-missing}" "$RELEASE_SHA" >&2
            exit 1
          fi
          assets=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          if ! grep -Fx "$RELEASE_APK_NAME" <<<"$assets" >/dev/null \
              || ! grep -Fx 'SHA256SUMS.txt' <<<"$assets" >/dev/null; then
            printf 'STOP: final release is missing one or more required assets.\n' >&2
            exit 1
          fi
          printf 'Release %s verified at %s.\n' "$RELEASE_TAG" "$RELEASE_SHA"

      - name: Release summary
        if: always()
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_SOURCE: ${{ steps.version.outputs.version_source }}
          RELEASE_SHA: ${{ steps.source.outputs.release_sha }}
          PACKAGE_NAME: ${{ steps.build.outputs.package_name }}
          RESUME_DRAFT: ${{ steps.version.outputs.resume_draft }}
        shell: bash
        run: |
          {
            printf '## NetVeil Manual Release\n\n'
            printf -- '- Result: `%s`\n' '${{ job.status }}'
            printf -- '- Tag: `%s`\n' "${RELEASE_TAG:-unresolved}"
            printf -- '- versionName: `%s`\n' "${VERSION_NAME:-unresolved}"
            printf -- '- versionCode: `%s`\n' "${VERSION_CODE:-unresolved}"
            printf -- '- Version source: `%s`\n' "${VERSION_SOURCE:-unresolved}"
            printf -- '- Android package: `%s`\n' "${PACKAGE_NAME:-unresolved}"
            printf -- '- Release source: `%s`\n' "${RELEASE_SHA:-not-pushed}"
            printf -- '- Resumed draft: `%s`\n' "${RESUME_DRAFT:-false}"
            printf -- '- Draft requested: `%s`\n' '${{ inputs.draft }}'
            printf -- '- Prerelease requested: `%s`\n' '${{ inputs.prerelease }}'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          rm -f ReleaseKey.jks keystore.properties
          rm -rf remote-check
