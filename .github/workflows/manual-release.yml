name: Manual Release

run-name: Manual Release · ${{ inputs.version_tag || 'auto' }}

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Exact release version/tag. Blank resumes the current prepared/draft release or auto-increments patch.'
        required: false
        type: string
      draft:
        description: 'Final release state: leave as draft'
        required: true
        default: false
        type: boolean
      prerelease:
        description: 'Final release state: mark as pre-release'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: netveil-manual-release
  cancel-in-progress: false

jobs:
  release:
    name: Build, verify and publish signed APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout selected release source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Validate release planner
        shell: bash
        run: python3 .github/scripts/manual_release.py --self-test

      - name: Build, verify and publish requested release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION_TAG: ${{ inputs.version_tag }}
          INPUT_DRAFT: ${{ inputs.draft }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: python3 .github/scripts/manual_release.py

      - name: Preserve qualified release bundle
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: qualified-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
