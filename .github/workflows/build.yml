name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Repository, workflow and country-data sanity
        shell: bash
        run: |
          set +e
          set +u
          set +o pipefail
          failed=0
          for path in \
            app/src/main/resources/META-INF/xposed/java_init.list \
            app/src/main/resources/META-INF/xposed/module.prop \
            app/src/main/assets/country-ip-pack.json \
            app/lint.xml \
            .github/scripts/manual_release.py \
            .github/scripts/test_repository_policy.py \
            .github/scripts/generate_country_pack.py \
            .github/scripts/test_generate_country_pack.py \
            .github/scripts/test_country_refresh_contract.py; do
            if [[ ! -f "$path" ]]; then
              printf 'ERROR: required build input is missing: %s\n' "$path" >&2
              failed=$((failed + 1))
            fi
          done
          if grep -R 'de.robv.android.xposed' -n app/src/main; then
            printf 'ERROR: unsupported Xposed API reference found.\n' >&2
            failed=$((failed + 1))
          fi
          if ! grep -F 'applicationId = "dev.ip.netveil"' app/build.gradle.kts >/dev/null; then
            printf 'ERROR: applicationId is not dev.ip.netveil.\n' >&2
            failed=$((failed + 1))
          fi
          if ! ruby -e 'require "yaml"; ARGV.each { |f| Psych.safe_load(File.read(f), permitted_classes: [], permitted_symbols: [], aliases: false); puts "OK #{f}" }' .github/workflows/*.yml; then
            printf 'ERROR: one or more GitHub workflow YAML files are invalid.\n' >&2
            failed=$((failed + 1))
          fi
          if ! python3 -m py_compile \
            .github/scripts/manual_release.py \
            .github/scripts/test_repository_policy.py \
            .github/scripts/generate_country_pack.py \
            .github/scripts/test_generate_country_pack.py \
            .github/scripts/test_country_refresh_contract.py; then
            printf 'ERROR: a repository/release/country-data Python driver has invalid syntax.\n' >&2
            failed=$((failed + 1))
          fi
          if ! python3 .github/scripts/test_repository_policy.py; then
            printf 'ERROR: standalone/current-only repository policy failed.\n' >&2
            failed=$((failed + 1))
          fi
          if ! python3 .github/scripts/manual_release.py --self-test; then
            printf 'ERROR: manual release planner self-test failed.\n' >&2
            failed=$((failed + 1))
          fi
          if ! python3 .github/scripts/generate_country_pack.py --self-test; then
            printf 'ERROR: country generator self-test failed.\n' >&2
            failed=$((failed + 1))
          fi
          if ! python3 .github/scripts/test_generate_country_pack.py; then
            printf 'ERROR: deterministic country generator/bundled-pack tests failed.\n' >&2
            failed=$((failed + 1))
          fi
          contract_args=()
          if [[ "${GITHUB_EVENT_NAME:-}" == "push" && "${GITHUB_REF:-}" == "refs/heads/main" ]]; then
            contract_args+=(--require-remote-match)
          fi
          if ! python3 .github/scripts/test_country_refresh_contract.py "${contract_args[@]}"; then
            printf 'ERROR: country refresh permission/endpoint contract failed.\n' >&2
            failed=$((failed + 1))
          fi
          if ((failed > 0)); then
            exit 1
          fi

      - name: Create ephemeral CI release key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt \
            -keystore "$GITHUB_WORKSPACE/ci-release.jks" \
            -storepass ci-netveil-password \
            -keypass ci-netveil-password \
            -alias netveil-ci \
            -keyalg RSA -keysize 2048 -validity 2 \
            -dname 'CN=NetVeil CI,O=cbkii,C=AU'
          cat > keystore.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/ci-release.jks
          storePassword=ci-netveil-password
          keyAlias=netveil-ci
          keyPassword=ci-netveil-password
          EOF

      - name: Unit tests, release lint and APK builds
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace --warning-mode=all \
            :app:testDebugUnitTest \
            :app:lintRelease \
            :app:assembleDebug \
            :app:assembleRelease

      - name: Verify debug and signed release APKs
        shell: bash
        run: |
          set -euo pipefail
          debug_apk='app/build/outputs/apk/debug/app-debug.apk'
          release_apk='app/build/outputs/apk/release/app-release.apk'
          for apk in "$debug_apk" "$release_apk"; do
            if [[ ! -s "$apk" ]]; then
              printf 'ERROR: expected APK is missing: %s\n' "$apk" >&2
              exit 1
            fi
          done

          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          if [[ -z "$build_tools" || ! -x "$build_tools/apksigner" || ! -x "$build_tools/aapt" ]]; then
            printf 'ERROR: Android build-tools verification binaries are unavailable.\n' >&2
            exit 1
          fi

          "$build_tools/apksigner" verify --verbose --print-certs "$release_apk"
          badging="$("$build_tools/aapt" dump badging "$release_apk")"
          grep -F "package: name='dev.ip.netveil'" <<<"$badging" >/dev/null || {
            printf 'ERROR: release APK package is not dev.ip.netveil.\n' >&2
            exit 1
          }
          for entry in \
            'META-INF/xposed/java_init.list' \
            'META-INF/xposed/module.prop' \
            'assets/country-ip-pack.json'; do
            unzip -Z1 "$release_apk" | grep -Fx "$entry" >/dev/null || {
              printf 'ERROR: %s missing from release APK.\n' "$entry" >&2
              exit 1
            }
          done

          module_prop="$(unzip -p "$release_apk" META-INF/xposed/module.prop)"
          expected_module_prop="$(printf '%s\n' \
            'minApiVersion=102' \
            'targetApiVersion=102' \
            'staticScope=false')"
          if [[ "$module_prop" != "$expected_module_prop" ]]; then
            printf 'ERROR: packaged Xposed API metadata differs from API-102 contract.\nExpected:\n%s\nActual:\n%s\n' \
              "$expected_module_prop" "$module_prop" >&2
            exit 1
          fi

          permissions="$("$build_tools/aapt" dump permissions "$release_apk" \
            | sed -n "s/^uses-permission: name='\([^']*\)'.*/\1/p" | sort -u)"
          expected_permissions="$(printf '%s\n' \
            android.permission.ACCESS_NETWORK_STATE \
            android.permission.INTERNET \
            android.permission.RECEIVE_BOOT_COMPLETED | sort)"
          if [[ "$permissions" != "$expected_permissions" ]]; then
            printf 'ERROR: release APK permissions differ from the exact allow-list.\nExpected:\n%s\nActual:\n%s\n' \
              "$expected_permissions" "$permissions" >&2
            exit 1
          fi

          printf 'APK sizes:\n'
          stat -c '%n %s bytes' "$debug_apk" "$release_apk"
          sha256sum "$debug_apk" "$release_apk"

      - name: Remove ephemeral signing material
        if: always()
        shell: bash
        run: rm -f ci-release.jks keystore.properties

      - uses: actions/upload-artifact@v6
        with:
          name: netveil-ci-apks-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
