name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Repository and workflow sanity
        shell: bash
        run: |
          set +e
          set +u
          set +o pipefail
          failed=0
          for path in \
            app/src/main/resources/META-INF/xposed/java_init.list \
            app/src/main/resources/META-INF/xposed/module.prop \
            app/lint.xml; do
            if [[ ! -f "$path" ]]; then
              printf 'ERROR: required build input is missing: %s\n' "$path" >&2
              failed=$((failed + 1))
            fi
          done
          if grep -R 'de.robv.android.xposed' -n app/src/main; then
            printf 'ERROR: legacy Xposed API reference found.\n' >&2
            failed=$((failed + 1))
          fi
          if grep -R 'android.permission.INTERNET' -n app/src/main; then
            printf 'ERROR: unexpected INTERNET permission found.\n' >&2
            failed=$((failed + 1))
          fi
          if ! grep -F 'applicationId = "dev.ip.netveil"' app/build.gradle.kts >/dev/null; then
            printf 'ERROR: applicationId is not dev.ip.netveil.\n' >&2
            failed=$((failed + 1))
          fi
          if ! ruby -e 'require "yaml"; ARGV.each { |f| Psych.safe_load(File.read(f), permitted_classes: [], permitted_symbols: [], aliases: false); puts "OK #{f}" }' .github/workflows/*.yml; then
            printf 'ERROR: one or more GitHub workflow YAML files are invalid.\n' >&2
            failed=$((failed + 1))
          fi
          if ((failed > 0)); then
            exit 1
          fi

      - name: Create ephemeral CI release key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt \
            -keystore "$GITHUB_WORKSPACE/ci-release.jks" \
            -storepass ci-netveil-password \
            -keypass ci-netveil-password \
            -alias netveil-ci \
            -keyalg RSA -keysize 2048 -validity 2 \
            -dname 'CN=NetVeil CI,O=cbkii,C=AU'
          cat > keystore.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/ci-release.jks
          storePassword=ci-netveil-password
          keyAlias=netveil-ci
          keyPassword=ci-netveil-password
          EOF

      - name: Unit tests, release lint and APK builds
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace --warning-mode=all \
            :app:testDebugUnitTest \
            :app:lintRelease \
            :app:assembleDebug \
            :app:assembleRelease

      - name: Verify debug and signed release APKs
        shell: bash
        run: |
          set -euo pipefail
          debug_apk='app/build/outputs/apk/debug/app-debug.apk'
          release_apk='app/build/outputs/apk/release/app-release.apk'
          for apk in "$debug_apk" "$release_apk"; do
            if [[ ! -s "$apk" ]]; then
              printf 'ERROR: expected APK is missing: %s\n' "$apk" >&2
              exit 1
            fi
          done

          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          if [[ -z "$build_tools" || ! -x "$build_tools/apksigner" || ! -x "$build_tools/aapt" ]]; then
            printf 'ERROR: Android build-tools verification binaries are unavailable.\n' >&2
            exit 1
          fi

          "$build_tools/apksigner" verify --verbose --print-certs "$release_apk"
          badging="$("$build_tools/aapt" dump badging "$release_apk")"
          grep -F "package: name='dev.ip.netveil'" <<<"$badging" >/dev/null || {
            printf 'ERROR: release APK package is not dev.ip.netveil.\n' >&2
            exit 1
          }
          unzip -l "$release_apk" | grep -F 'META-INF/xposed/java_init.list' >/dev/null || {
            printf 'ERROR: java_init.list missing from release APK.\n' >&2
            exit 1
          }
          unzip -l "$release_apk" | grep -F 'META-INF/xposed/module.prop' >/dev/null || {
            printf 'ERROR: module.prop missing from release APK.\n' >&2
            exit 1
          }
          if "$build_tools/aapt" dump permissions "$release_apk" | grep -F 'android.permission.INTERNET'; then
            printf 'ERROR: release APK unexpectedly requests INTERNET.\n' >&2
            exit 1
          fi
          sha256sum "$debug_apk" "$release_apk"

      - name: Remove ephemeral signing material
        if: always()
        shell: bash
        run: rm -f ci-release.jks keystore.properties

      - uses: actions/upload-artifact@v6
        with:
          name: netveil-ci-apks-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
