name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Repository and workflow sanity
        shell: bash
        run: |
          set +e
          set +u
          set +o pipefail
          failed=0
          for path in \
            app/src/main/resources/META-INF/xposed/java_init.list \
            app/src/main/resources/META-INF/xposed/module.prop \
            app/lint.xml; do
            if [[ ! -f "$path" ]]; then
              printf 'ERROR: required build input is missing: %s\n' "$path" >&2
              failed=$((failed + 1))
            fi
          done
          if grep -R 'de.robv.android.xposed' -n app/src/main; then
            printf 'ERROR: legacy Xposed API reference found.\n' >&2
            failed=$((failed + 1))
          fi
          if grep -R 'android.permission.INTERNET' -n app/src/main; then
            printf 'ERROR: unexpected INTERNET permission found.\n' >&2
            failed=$((failed + 1))
          fi
          if ! grep -F 'applicationId = "dev.ip.netveil"' app/build.gradle.kts >/dev/null; then
            printf 'ERROR: applicationId is not dev.ip.netveil.\n' >&2
            failed=$((failed + 1))
          fi
          if ! ruby -e 'require "yaml"; ARGV.each { |f| Psych.safe_load(File.read(f), permitted_classes: [], permitted_symbols: [], aliases: false); puts "OK #{f}" }' .github/workflows/*.yml; then
            printf 'ERROR: one or more GitHub workflow YAML files are invalid.\n' >&2
            failed=$((failed + 1))
          fi
          if ((failed > 0)); then
            exit 1
          fi

      - name: Unit tests, release lint and debug APK
        shell: bash
        run: |
          if ! gradle --no-daemon --stacktrace --warning-mode=all \
              :app:testDebugUnitTest :app:lintRelease :app:assembleDebug; then
            printf 'ERROR: tests, release lint or debug build failed.\n' >&2
            exit 1
          fi

      - name: Verify debug APK exists
        shell: bash
        run: |
          apk='app/build/outputs/apk/debug/app-debug.apk'
          if [[ ! -s "$apk" ]]; then
            printf 'ERROR: expected debug APK is missing: %s\n' "$apk" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: netveil-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
