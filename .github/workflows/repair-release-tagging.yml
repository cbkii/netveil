name: Temporary release tag repair

on:
  push:
    branches: [ fix/release-workflow ]
    paths:
      - .github/workflows/repair-release-tagging.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/release-workflow
          fetch-depth: 0

      - name: Make tag creation explicit and retry-safe
        shell: bash
        run: |
          set +e
          set +u
          set +o pipefail
          python3 - <<'PY'
          from pathlib import Path
          import sys

          path = Path('.github/workflows/manual-release.yml')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '''            elif [[ -n "$source_tag_sha" ]]; then\n              printf 'STOP: tag %s exists without a GitHub Release; refusing ambiguous recovery.\\n' "$source_tag" >&2\n              exit 1\n            elif [[ "$head_subject" == "$prepared_subject" ]]; then''',
                  '''            elif [[ -n "$source_tag_sha" ]]; then\n              if [[ "$head_subject" == "$prepared_subject" && "$source_tag_sha" == "$head_sha" ]]; then\n                target_version=$source_version\n                version_source='resume-prepared-tag'\n              else\n                printf 'STOP: tag %s exists without a GitHub Release and does not match a prepared release HEAD.\\n' \\\n                  "$source_tag" >&2\n                exit 1\n              fi\n            elif [[ "$head_subject" == "$prepared_subject" ]]; then'''
              ),
              (
                  '''          if [[ -n "$remote_tag_sha" && "$existing_release" != 'true' ]]; then\n            printf 'STOP: tag %s exists without a GitHub Release; refusing ambiguous recovery.\\n' "$release_tag" >&2\n            exit 1\n          fi''',
                  '''          if [[ -n "$remote_tag_sha" && "$existing_release" != 'true' ]]; then\n            target_prepared_subject="chore(release): prepare ${release_tag}"\n            if [[ "$metadata_changed" == 'false' && "$remote_tag_sha" == "$head_sha" \\\n                  && "$head_subject" == "$target_prepared_subject" ]]; then\n              printf 'Found resumable prepared tag %s at current HEAD.\\n' "$release_tag"\n            else\n              printf 'STOP: tag %s exists without a GitHub Release and is not a safe prepared-release resume point.\\n' \\\n                "$release_tag" >&2\n              exit 1\n            fi\n          fi'''
              ),
              (
                  '''          tag_sha=$(git ls-remote --refs origin "refs/tags/${RELEASE_TAG}" | awk 'NR==1 {print $1}')\n          if [[ "$existing_release" == 'true' ]]; then\n            if [[ -z "$tag_sha" || "$tag_sha" != "$RELEASE_SHA" ]]; then\n              printf 'STOP: resumable draft tag %s points to %s; expected %s.\\n' \\\n                "$RELEASE_TAG" "${tag_sha:-missing}" "$RELEASE_SHA" >&2\n              exit 1\n            fi\n            printf 'Resuming existing draft release %s.\\n' "$RELEASE_TAG"\n          else\n            if [[ -n "$tag_sha" ]]; then\n              printf 'STOP: tag %s appeared without a draft release while building.\\n' "$RELEASE_TAG" >&2\n              exit 1\n            fi\n            args=(\n              release create "$RELEASE_TAG"\n              --repo "$GITHUB_REPOSITORY"\n              --target "$RELEASE_SHA"\n              --title "NetVeil ${RELEASE_TAG}"\n              --generate-notes\n              --draft\n            )\n            if [[ "$PRERELEASE" == 'true' ]]; then\n              args+=(--prerelease)\n            fi\n            if ! gh "${args[@]}"; then\n              printf 'STOP: failed to create draft release %s.\\n' "$RELEASE_TAG" >&2\n              exit 1\n            fi\n          fi''',
                  '''          tag_sha=$(git ls-remote --refs origin "refs/tags/${RELEASE_TAG}" | awk 'NR==1 {print $1}')\n          if [[ "$existing_release" == 'true' ]]; then\n            if [[ -z "$tag_sha" || "$tag_sha" != "$RELEASE_SHA" ]]; then\n              printf 'STOP: resumable draft tag %s points to %s; expected %s.\\n' \\\n                "$RELEASE_TAG" "${tag_sha:-missing}" "$RELEASE_SHA" >&2\n              exit 1\n            fi\n            printf 'Resuming existing draft release %s.\\n' "$RELEASE_TAG"\n          else\n            if [[ -n "$tag_sha" && "$tag_sha" != "$RELEASE_SHA" ]]; then\n              printf 'STOP: prepared tag %s points to %s; expected %s.\\n' \\\n                "$RELEASE_TAG" "$tag_sha" "$RELEASE_SHA" >&2\n              exit 1\n            fi\n            if [[ -z "$tag_sha" ]]; then\n              if ! git tag "$RELEASE_TAG" "$RELEASE_SHA"; then\n                printf 'STOP: failed to create local release tag %s.\\n' "$RELEASE_TAG" >&2\n                exit 1\n              fi\n              if ! git push origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"; then\n                printf 'STOP: failed to push exact release tag %s; release draft not created.\\n' "$RELEASE_TAG" >&2\n                exit 1\n              fi\n              tag_sha=$(git ls-remote --refs origin "refs/tags/${RELEASE_TAG}" | awk 'NR==1 {print $1}')\n              if [[ "$tag_sha" != "$RELEASE_SHA" ]]; then\n                printf 'STOP: pushed tag %s resolves to %s; expected %s.\\n' \\\n                  "$RELEASE_TAG" "${tag_sha:-missing}" "$RELEASE_SHA" >&2\n                exit 1\n              fi\n            else\n              printf 'Resuming from existing prepared tag %s.\\n' "$RELEASE_TAG"\n            fi\n\n            args=(\n              release create "$RELEASE_TAG"\n              --repo "$GITHUB_REPOSITORY"\n              --verify-tag\n              --title "NetVeil ${RELEASE_TAG}"\n              --generate-notes\n              --draft\n            )\n            if [[ "$PRERELEASE" == 'true' ]]; then\n              args+=(--prerelease)\n            fi\n            if ! gh "${args[@]}"; then\n              printf 'STOP: failed to create draft release %s; prepared tag is retained for a safe retry.\\n' \\\n                "$RELEASE_TAG" >&2\n              exit 1\n            fi\n          fi'''
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  print(f'STOP: expected one release-tag patch match, found {count}: {old[:90]!r}', file=sys.stderr)
                  sys.exit(1)
              text = text.replace(old, new, 1)

          required = (
              'version_source=\'resume-prepared-tag\'',
              'git push origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"',
              '--verify-tag',
              'prepared tag is retained for a safe retry',
          )
          for token in required:
              if token not in text:
                  print(f'STOP: expected tag-hardening token is missing: {token}', file=sys.stderr)
                  sys.exit(1)

          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          rc=$?
          if ((rc != 0)); then
            exit "$rc"
          fi

      - name: Commit repaired workflow
        shell: bash
        run: |
          set +e
          set +u
          set +o pipefail
          path='.github/workflows/manual-release.yml'
          if git diff --quiet -- "$path"; then
            printf 'STOP: release tag repair produced no diff.\n' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$path"
          if ! git commit -m 'fix: make release tag creation explicit and resumable'; then
            printf 'STOP: failed to commit release tag repair.\n' >&2
            exit 1
          fi
          if ! git push origin HEAD:fix/release-workflow; then
            printf 'STOP: failed to push release tag repair.\n' >&2
            exit 1
          fi
