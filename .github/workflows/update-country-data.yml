name: Update Country Data

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'
  pull_request:
    paths:
      - '.github/scripts/generate_country_pack.py'
      - '.github/scripts/test_generate_country_pack.py'
      - '.github/scripts/test_country_refresh_contract.py'
      - '.github/scripts/test_repository_policy.py'
      - '.github/workflows/update-country-data.yml'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/src/main/assets/country-ip-pack.json'
      - 'app/src/main/java/io/github/cbkii/netveil/country/CountryPack.java'
      - 'app/src/main/java/io/github/cbkii/netveil/country/CountryPackStore.java'
      - 'app/src/main/java/io/github/cbkii/netveil/country/CountryRefreshScheduler.java'

permissions:
  contents: read

concurrency:
  group: netveil-country-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      live_ok: ${{ steps.generate.outputs.live_ok }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Validate repository, generator, canonical pack and public refresh contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            .github/scripts/test_repository_policy.py \
            .github/scripts/generate_country_pack.py \
            .github/scripts/test_generate_country_pack.py \
            .github/scripts/test_country_refresh_contract.py
          python3 .github/scripts/test_repository_policy.py
          python3 .github/scripts/generate_country_pack.py --self-test
          python3 .github/scripts/test_generate_country_pack.py
          python3 .github/scripts/test_country_refresh_contract.py

      - name: Regenerate from live public routing/provider sources
        id: generate
        shell: bash
        run: |
          set -uo pipefail
          output='generated-country-ip-pack.json'
          if python3 .github/scripts/generate_country_pack.py --output "$output"; then
            printf 'live_ok=true\n' >> "$GITHUB_OUTPUT"
          else
            printf '::warning::Live country-data regeneration failed; retaining the canonical validated pack.\n'
            printf 'live_ok=false\n' >> "$GITHUB_OUTPUT"
          fi

          python3 .github/scripts/test_generate_country_pack.py || {
            printf 'ERROR: the canonical country-data pack is invalid.\n' >&2
            exit 1
          }

      - name: Upload generated pack for audit/update handoff
        if: steps.generate.outputs.live_ok == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: netveil-country-pack-${{ github.run_id }}
          path: generated-country-ip-pack.json
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        if: always()
        shell: bash
        env:
          LIVE_OK: ${{ steps.generate.outputs.live_ok }}
        run: |
          result="${LIVE_OK:-not-run}"
          {
            printf '## Country data live check\n\n'
            printf -- '- Live regeneration: `%s`\n' "$result"
            printf -- '- Canonical repository: `cbkii/netveil`\n'
            printf -- '- Canonical asset: `app/src/main/assets/country-ip-pack.json`\n'
            printf -- '- Countries: `AU US GB ID FR`\n'
            printf -- '- PR and non-main validation are read-only.\n'
            printf -- '- Existing validated data remains authoritative when optional/live sources fail.\n'
          } >> "$GITHUB_STEP_SUMMARY"

  update:
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      needs.live-check.outputs.live_ok == 'true'
    needs: live-check
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Download validated generated pack
        uses: actions/download-artifact@v6
        with:
          name: netveil-country-pack-${{ github.run_id }}
          path: generated-country-pack

      - name: Validate generated pack and pin main state
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          generated='generated-country-pack/generated-country-ip-pack.json'
          canonical='app/src/main/assets/country-ip-pack.json'
          test -s "$generated" || {
            printf 'ERROR: validated generated pack artifact is missing.\n' >&2
            exit 1
          }

          python3 - "$generated" <<'PY'
          import importlib.util
          import json
          import sys
          from pathlib import Path
          script = Path('.github/scripts/generate_country_pack.py')
          spec = importlib.util.spec_from_file_location('country_generator', script)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)
          module.validate_pack(json.loads(Path(sys.argv[1]).read_text(encoding='utf-8')))
          PY

          if [[ "$GITHUB_REF" != 'refs/heads/main' || "$GITHUB_REF_NAME" != 'main' ]]; then
            printf 'ERROR: authoritative country updater may write only main.\n' >&2
            exit 1
          fi
          start_sha="$(git rev-parse HEAD)"
          git fetch origin '+refs/heads/main:refs/remotes/origin/main'
          remote_sha="$(git rev-parse origin/main)"
          if [[ "$start_sha" != "$remote_sha" ]]; then
            printf 'ERROR: main moved before country-data update: local=%s remote=%s\n' \
              "$start_sha" "$remote_sha" >&2
            exit 1
          fi
          printf 'start_sha=%s\n' "$start_sha" >> "$GITHUB_OUTPUT"

          changed="$(python3 - "$generated" "$canonical" <<'PY'
          import json
          import sys
          from pathlib import Path
          def material(path):
              data = json.loads(Path(path).read_text(encoding='utf-8'))
              data.pop('generated_at', None)
              return data
          print('true' if material(sys.argv[1]) != material(sys.argv[2]) else 'false')
          PY
          )"
          printf 'changed=%s\n' "$changed" >> "$GITHUB_OUTPUT"

      - name: Commit changed canonical pack
        id: commit
        shell: bash
        env:
          CHANGED: ${{ steps.prepare.outputs.changed }}
          START_SHA: ${{ steps.prepare.outputs.start_sha }}
        run: |
          set -euo pipefail
          generated='generated-country-pack/generated-country-ip-pack.json'
          canonical='app/src/main/assets/country-ip-pack.json'

          if [[ "$CHANGED" != 'true' ]]; then
            printf 'Candidate/provider dataset is unchanged; no canonical commit required.\n'
            printf 'changed=false\n' >> "$GITHUB_OUTPUT"
            printf 'commit_sha=%s\n' "$START_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cp "$generated" "$canonical"
          python3 .github/scripts/test_generate_country_pack.py
          changed_paths="$(git diff --name-only)"
          if [[ "$changed_paths" != "$canonical" ]]; then
            printf 'ERROR: country updater changed unexpected paths:\n%s\n' "$changed_paths" >&2
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$canonical"
          git commit -m 'chore(data): refresh country IP candidates'
          new_sha="$(git rev-parse HEAD)"
          git push --force-with-lease="refs/heads/main:${START_SHA}" origin HEAD:main
          printf 'changed=true\n' >> "$GITHUB_OUTPUT"
          printf 'commit_sha=%s\n' "$new_sha" >> "$GITHUB_OUTPUT"

      - name: Verify canonical public publication
        shell: bash
        env:
          CHANGED: ${{ steps.commit.outputs.changed }}
          COMMIT_SHA: ${{ steps.commit.outputs.commit_sha }}
        run: |
          set -euo pipefail
          canonical='app/src/main/assets/country-ip-pack.json'
          generated='generated-country-pack/generated-country-ip-pack.json'
          path='app/src/main/assets/country-ip-pack.json'

          if [[ "$CHANGED" == 'true' ]]; then
            immutable="https://raw.githubusercontent.com/cbkii/netveil/${COMMIT_SHA}/${path}?run=${GITHUB_RUN_ID}"
            verified=0
            for _ in 1 2 3 4; do
              if curl --fail --silent --show-error --location \
                  --connect-timeout 8 --max-time 20 \
                  -H 'Accept: application/json' \
                  -H 'User-Agent: NetVeil-country-pack-publisher/2' \
                  "$immutable" -o immutable-country-pack.json \
                  && cmp -s "$generated" immutable-country-pack.json; then
                verified=1
                break
              fi
              sleep 2
            done
            if [[ "$verified" != 1 ]]; then
              printf 'ERROR: immutable committed country pack is not anonymously available as expected.\n' >&2
              exit 1
            fi
            cp "$generated" "$canonical"
          fi

          python3 .github/scripts/test_country_refresh_contract.py --require-remote-match

      - name: Summary
        if: always()
        shell: bash
        env:
          CHANGED: ${{ steps.commit.outputs.changed }}
          COMMIT_SHA: ${{ steps.commit.outputs.commit_sha }}
        run: |
          {
            printf '## Country data repository update\n\n'
            printf -- '- Canonical asset: `app/src/main/assets/country-ip-pack.json`\n'
            printf -- '- Canonical public endpoint: `https://raw.githubusercontent.com/cbkii/netveil/main/app/src/main/assets/country-ip-pack.json`\n'
            printf -- '- Material dataset changed: `%s`\n' "${CHANGED:-not-run}"
            printf -- '- Resulting main SHA: `%s`\n' "${COMMIT_SHA:-not-run}"
            printf -- '- Writes are confined to `main` and use the job-scoped `GITHUB_TOKEN`.\n'
            printf -- '- No cross-repository token or mirror is used.\n'
          } >> "$GITHUB_STEP_SUMMARY"
