name: Update Country Data

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'
  pull_request:
    paths:
      - '.github/scripts/generate_country_pack.py'
      - '.github/scripts/test_generate_country_pack.py'
      - '.github/scripts/test_country_refresh_contract.py'
      - '.github/workflows/update-country-data.yml'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/src/main/assets/country-ip-pack.json'
      - 'app/src/main/java/io/github/cbkii/netveil/country/CountryPackStore.java'
      - 'app/src/main/java/io/github/cbkii/netveil/country/CountryRefreshScheduler.java'

permissions:
  contents: read

concurrency:
  group: netveil-country-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      live_ok: ${{ steps.generate.outputs.live_ok }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Validate generator, fallback pack and public refresh contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            .github/scripts/generate_country_pack.py \
            .github/scripts/test_generate_country_pack.py \
            .github/scripts/test_country_refresh_contract.py
          python3 .github/scripts/generate_country_pack.py --self-test
          python3 .github/scripts/test_generate_country_pack.py
          python3 .github/scripts/test_country_refresh_contract.py

      - name: Regenerate from live public routing/provider sources
        id: generate
        shell: bash
        run: |
          set -uo pipefail
          output='app/src/main/assets/country-ip-pack.json'
          if python3 .github/scripts/generate_country_pack.py --output "$output"; then
            printf 'live_ok=true\n' >> "$GITHUB_OUTPUT"
          else
            printf '::warning::Live country-data regeneration failed; retaining the last validated bundled pack.\n'
            printf 'live_ok=false\n' >> "$GITHUB_OUTPUT"
          fi

          # The existing/bundled pack must remain valid even if every live source is unavailable.
          python3 .github/scripts/test_generate_country_pack.py || {
            printf 'ERROR: no valid country-data pack remains after generation attempt.\n' >&2
            exit 1
          }

      - name: Upload generated pack for audit/update handoff
        if: steps.generate.outputs.live_ok == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: netveil-country-pack-${{ github.run_id }}
          path: app/src/main/assets/country-ip-pack.json
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        if: always()
        shell: bash
        env:
          LIVE_OK: ${{ steps.generate.outputs.live_ok }}
        run: |
          result="${LIVE_OK:-not-run}"
          {
            printf '## Country data live check\n\n'
            printf -- '- Live regeneration: `%s`\n' "$result"
            printf -- '- Countries: `AU US GB ID FR`\n'
            printf -- '- PR validation uses read-only repository permissions.\n'
            printf -- '- Anonymous refresh endpoint and permission contract are validated before generation.\n'
            printf -- '- Existing validated pack remains authoritative when optional/live sources fail.\n'
          } >> "$GITHUB_STEP_SUMMARY"

  update:
    if: github.event_name != 'pull_request' && needs.live-check.outputs.live_ok == 'true'
    needs: live-check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Download validated live pack
        uses: actions/download-artifact@v6
        with:
          name: netveil-country-pack-${{ github.run_id }}
          path: generated-country-pack

      - name: Validate generated pack and pin private branch state
        shell: bash
        run: |
          set -euo pipefail
          generated='generated-country-pack/country-ip-pack.json'
          output='app/src/main/assets/country-ip-pack.json'
          test -s "$generated" || {
            printf 'ERROR: validated generated pack artifact is missing.\n' >&2
            exit 1
          }
          cp "$generated" "$output"
          python3 .github/scripts/test_generate_country_pack.py

          branch="$GITHUB_REF_NAME"
          if [[ "$GITHUB_REF_TYPE" != 'branch' || -z "$branch" ]]; then
            printf 'ERROR: updater must run from a branch; ref type is %s.\n' "$GITHUB_REF_TYPE" >&2
            exit 1
          fi
          start_sha="$(git rev-parse HEAD)"
          git fetch origin "+refs/heads/${branch}:refs/remotes/origin/${branch}"
          remote_sha="$(git rev-parse "origin/${branch}")"
          if [[ "$start_sha" != "$remote_sha" ]]; then
            printf 'ERROR: source branch moved before country-data publication: local=%s remote=%s\n' \
              "$start_sha" "$remote_sha" >&2
            exit 1
          fi
          printf '%s\n' "$start_sha" > .country-update-start-sha

      - name: Publish validated pack to anonymous public mirror
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.NETVEIL_DATA_TOKEN }}
          PUBLIC_REPO: cbkii/media
          PUBLIC_BRANCH: netveil-data
          PUBLIC_PATH: netveil-data/country-ip-pack.json
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            printf 'ERROR: NETVEIL_DATA_TOKEN is required to update the public country-pack mirror.\n' >&2
            printf 'Configure a fine-grained token with Contents: write for %s.\n' "$PUBLIC_REPO" >&2
            exit 1
          fi

          generated='generated-country-pack/country-ip-pack.json'
          api="repos/${PUBLIC_REPO}/contents/${PUBLIC_PATH}"
          current_json="$(gh api --method GET "$api" -f ref="$PUBLIC_BRANCH")"
          current_sha="$(jq -r '.sha' <<<"$current_json")"
          current_file="$(mktemp)"
          jq -r '.content' <<<"$current_json" | tr -d '\n' | base64 --decode > "$current_file"

          if cmp -s "$generated" "$current_file"; then
            printf 'Public country pack is unchanged; no mirror commit required.\n'
          else
            encoded="$(base64 -w0 "$generated")"
            gh api --method PUT "$api" \
              -f message='chore(data): refresh NetVeil country IP candidates' \
              -f branch="$PUBLIC_BRANCH" \
              -f sha="$current_sha" \
              -f content="$encoded" \
              --jq '.commit.sha' > .country-public-commit-sha
          fi

          public_url="https://raw.githubusercontent.com/${PUBLIC_REPO}/${PUBLIC_BRANCH}/${PUBLIC_PATH}?run=${GITHUB_RUN_ID}"
          verified=0
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location \
                --connect-timeout 8 --max-time 20 \
                -H 'Accept: application/json' \
                -H 'User-Agent: NetVeil-country-pack-publisher/1' \
                "$public_url" -o public-country-pack.json \
                && cmp -s "$generated" public-country-pack.json; then
              verified=1
              break
            fi
            sleep 2
          done
          if [[ "$verified" != 1 ]]; then
            printf 'ERROR: anonymous public mirror did not converge to the validated generated pack.\n' >&2
            exit 1
          fi

          # Re-run the same app/release contract after publication, now against the generated pack.
          cp "$generated" app/src/main/assets/country-ip-pack.json
          python3 .github/scripts/test_country_refresh_contract.py

      - name: Commit changed bundled pack
        shell: bash
        run: |
          set -euo pipefail
          output='app/src/main/assets/country-ip-pack.json'
          start_sha="$(cat .country-update-start-sha)"
          branch="$GITHUB_REF_NAME"

          if git diff --quiet -- "$output"; then
            printf 'Bundled country candidate data is unchanged; no private commit required.\n'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$output"
          git commit -m 'chore(data): refresh country IP candidates'
          git push --force-with-lease="refs/heads/${branch}:${start_sha}" origin "HEAD:${branch}"

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            printf '## Country data repository update\n\n'
            printf -- '- Source artifact came from this run\x27s read-only live-check job.\n'
            printf -- '- Validated bytes are published first to the anonymous public mirror.\n'
            printf -- '- Public mirror: `cbkii/media` branch `netveil-data`.\n'
            printf -- '- Cross-repository writes require secret `NETVEIL_DATA_TOKEN`.\n'
            printf -- '- Private repository write permission remains confined to this scheduled/manual update job.\n'
          } >> "$GITHUB_STEP_SUMMARY"
