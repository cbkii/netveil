name: Temporary cleanup

on:
  push:
    branches: [ fix/release-workflow ]
    paths:
      - .github/workflows/repair-network-introspection.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/release-workflow
          fetch-depth: 0

      - name: Remove superseded lint suppression and temporary workflow
        shell: bash
        run: |
          set +e
          set +u
          set +o pipefail
          python3 - <<'PY'
          from pathlib import Path
          import sys

          replacements = {
              Path('app/build.gradle.kts'): (
                  '''\n    lint {\n        // NetVeil is an Xposed module whose hook implementation intentionally inspects\n        // selected framework internals. Keep the exception narrow: all other lint\n        // checks remain enabled and hidden-API findings outside NetworkHooks still fail.\n        lintConfig = file("lint.xml")\n    }\n''',
                  '\n',
              ),
              Path('.github/workflows/build.yml'): (
                  '''            app/src/main/resources/META-INF/xposed/module.prop \\\n            app/lint.xml; do''',
                  '''            app/src/main/resources/META-INF/xposed/module.prop; do''',
              ),
              Path('.github/workflows/manual-release.yml'): (
                  '''            app/build.gradle.kts \\\n            app/lint.xml; do''',
                  '''            app/build.gradle.kts; do''',
              ),
          }

          for path, (old, new) in replacements.items():
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  print(f'STOP: expected one cleanup match in {path}, found {count}.', file=sys.stderr)
                  sys.exit(1)
              path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          network = Path('app/src/main/java/io/github/cbkii/netveil/xposed/NetworkHooks.java').read_text(encoding='utf-8')
          forbidden = (
              'getDeclaredField("mNetworkType")',
              'getDeclaredField("mTransportTypes")',
              'java.lang.reflect.Field',
          )
          for token in forbidden:
              if token in network:
                  print(f'STOP: private-field reflection remains: {token}', file=sys.stderr)
                  sys.exit(1)
          required = (
              'networkInfoGetTypeOrigin.invoke(info)',
              'networkCapabilitiesHasTransportOrigin.invoke(capabilities, transport)',
              'invoker.setType(XposedInterface.Invoker.Type.ORIGIN)',
          )
          for token in required:
              if token not in network:
                  print(f'STOP: origin-invoker repair missing: {token}', file=sys.stderr)
                  sys.exit(1)
          PY
          rc=$?
          if ((rc != 0)); then
            exit "$rc"
          fi

          if [[ ! -f app/lint.xml ]]; then
            printf 'STOP: expected superseded app/lint.xml before cleanup.\n' >&2
            exit 1
          fi
          git rm -- app/lint.xml .github/workflows/repair-network-introspection.yml

      - name: Commit final cleanup
        shell: bash
        run: |
          set +e
          set +u
          set +o pipefail
          if git diff --quiet && git diff --cached --quiet; then
            printf 'STOP: cleanup produced no diff.\n' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- app/build.gradle.kts .github/workflows/build.yml .github/workflows/manual-release.yml
          if ! git commit -m 'chore: remove superseded lint suppression scaffolding'; then
            printf 'STOP: failed to commit final cleanup.\n' >&2
            exit 1
          fi
          if ! git push origin HEAD:fix/release-workflow; then
            printf 'STOP: failed to push final cleanup.\n' >&2
            exit 1
          fi
